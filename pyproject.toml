[project]
name = "practice-dsc10-com"
version = "0.1.0"
description = "Static site generator for practice.dsc10.com"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "lxml>=5.0.0",
    "pyyaml>=6.0.2",
    "regex>=2024.9.11",
    "pypandoc_binary==1.17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
