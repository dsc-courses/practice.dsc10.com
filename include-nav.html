<!-- Top menu bar, styled after dsc10.com's. Plain links, no JavaScript, so Ctrl+F still finds everything. -->
<!-- run.py fills in {root} (path from the page to docs/) and {home} (link to the homepage; empty on the homepage itself). -->
<style>
  :root { --site-nav-h: 3.5rem; }
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    min-height: var(--site-nav-h);
    display: flex;
    align-items: center;
    gap: .3rem 1.5rem;
    padding: .5rem 7.5%;
    background: #fff;
    border-bottom: 1px solid #eeebee;
    font-size: .85rem;
  }
  .site-nav a { white-space: nowrap; }
  .site-nav .site-nav-brand {
    margin-right: auto;
    font-size: 1.25rem;
    color: var(--color-text);
  }
  /* Narrow screens: drop the site name and let the links wrap to a second line. */
  @media (max-width: 800px) {
    :root { --site-nav-h: 4.5rem; }
    .site-nav { flex-wrap: wrap; justify-content: center; gap: .3rem 1rem; padding: .5rem 1rem; }
    .site-nav .site-nav-brand { display: none; }
  }
  /* Leave room for the bar above the title, and below it after a jump to a section. */
  body { padding-top: max(7.5%, calc(var(--site-nav-h) + 1.5rem)); }
  html { scroll-padding-top: calc(var(--site-nav-h) + 1rem); }
</style>
<nav class="site-nav" aria-label="Sections">
<a class="site-nav-brand" href="{home}#">DSC 10 Practice</a>
<a href="{root}pretest/index.html">🧮 Pretest</a>
<a href="{home}#discussions">💯 Discussions</a>
<a href="{home}#exams">📝 Exams</a>
<a href="{home}#quizzes">🙋‍♀️ Quizzes</a>
<a href="{home}#find-problems-by-lecture">🔎 By Lecture</a>
</nav>
