name: Build and Publish

on:
  push:
    # uv-stage-2 is a temporary test trigger. Remove it before merging.
    branches: [ master, uv-stage-2 ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.21"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build site
        run: uv run run.py

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
