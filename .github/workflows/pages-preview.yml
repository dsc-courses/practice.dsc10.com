name: Build Check

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'run.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - 'problems/**'
      - 'pages/**'
      - 'utils/**'
      - '.github/workflows/pages-preview.yml'

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.21"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build site
        run: uv run run.py

      - name: Upload the built site for download
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./docs
